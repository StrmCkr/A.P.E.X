name: Maven CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Build core library
        run: mvn --batch-mode --no-transfer-progress package

      - name: Build benchmark, JMH, and examples
        run: mvn --batch-mode --no-transfer-progress -Ptools package

      - name: Upload packaged jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-jars-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            A.P.E.X/target/*.jar
            A.P.E.X-benchmark/target/*.jar
            A.P.E.X-jmh/target/*.jar
            A.P.E.X-examples/target/*.jar
